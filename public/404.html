<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>404 — Page not found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { 
        font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        display: flex; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh; 
        padding: 20px;
        background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
      }
      .container {
        text-align: center;
        background: white;
        padding: 60px 40px;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        max-width: 500px;
      }
      h1 {
        font-size: 72px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 16px;
        line-height: 1;
      }
      .subtitle {
        font-size: 18px;
        color: #6b7280;
        margin-bottom: 32px;
        line-height: 1.6;
      }
      .buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      a {
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
        border: 2px solid transparent;
      }
      .btn-primary {
        background: #0f172a;
        color: white;
      }
      .btn-primary:hover {
        background: #1e293b;
        transform: translateY(-2px);
      }
      .btn-outline {
        background: white;
        color: #0f172a;
        border: 2px solid #0f172a;
      }
      .btn-outline:hover {
        background: #f5f5f5;
        transform: translateY(-2px);
      }
      .icon {
        font-size: 80px;
        margin-bottom: 24px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">😕</div>
      <h1>404</h1>
      <p class="subtitle">Oops! The page you're looking for doesn't exist or has been moved.</p>
      <div class="buttons">
        <a href="/" class="btn-outline">Go back home</a>
        <a href="/projects" class="btn-primary">View projects</a>
      </div>
    </div>
  </body>
</html>
