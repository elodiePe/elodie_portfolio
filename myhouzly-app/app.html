      '<label class="text-sm font-medium" for="mWhy">' + T.purpose + '</label><input id="mWhy" type="text" class="rounded-lg border border-slate-300 bg-white px-3 py-2">' +
      '<button type="submit" class="mt-2 rounded-full bg-brand-600 px-4 py-2 font-medium text-white hover:bg-brand-700">' + T.send + '</button></form></div></div>';
  }

  var root = document.getElementById("root"), scrollY0 = 0;
  function render(keepScroll){
    var y = window.scrollY;
    var main = S.view === "young" ? young() : S.view === "home" ? (S.role === "parent" ? homeParent() : homeChild()) : S.view === "money" ? money() : S.view === "house" ? house() : settings();
    root.innerHTML = header() + '<main class="mx-auto max-w-3xl px-4 py-6 pb-[calc(15rem+env(safe-area-inset-bottom))]">' + main + '</main>' + (S.view === "young" ? "" : nav()) + modal() + adhdScreen();
    if(keepScroll) window.scrollTo(0, y);
  }

  root.addEventListener("click", function(e){
    var t = e.target.closest("[data-go],[data-act],[data-mtab],[data-htab],[data-mode],[data-tx],[data-shop],[data-slot],[data-mview],[data-cview],[data-sec],[data-sw],[data-hold],[data-adhd-done]");
    if(!t){ if(S.menu){ S.menu = null; render(true); } return; }
    if(t.hasAttribute("data-act") && t.getAttribute("data-act") === "closeM" && e.target.closest("[data-keep]") && t === e.target.closest("[data-act]") && t.tagName !== "BUTTON") return;
    if(t.hasAttribute("data-go")){ var v = t.getAttribute("data-go"), tab = t.getAttribute("data-tab"); S.view = v; S.menu = null; if(tab){ if(v === "money") S.moneyTab = tab; if(v === "house") S.houseTab = tab; } window.scrollTo(0, 0); render(); return; }
    if(t.hasAttribute("data-mtab")){ S.moneyTab = t.getAttribute("data-mtab"); render(); return; }
    if(t.hasAttribute("data-htab")){ S.houseTab = t.getAttribute("data-htab"); render(); return; }
    if(t.hasAttribute("data-mode")){ S.mode = t.getAttribute("data-mode"); var a = document.getElementById("mAmt"), w = document.getElementById("mWhy"), av = a && a.value, wv = w && w.value; render(true); a = document.getElementById("mAmt"); w = document.getElementById("mWhy"); if(a) a.value = av || ""; if(w) w.value = wv || ""; return; }
    if(t.hasAttribute("data-slot")){ S.slot = t.getAttribute("data-slot"); render(true); return; }
    if(t.hasAttribute("data-mview")){ S.mview = t.getAttribute("data-mview"); render(true); return; }
    if(t.hasAttribute("data-cview")){ S.cview = t.getAttribute("data-cview"); render(true); return; }
    if(t.hasAttribute("data-sec")){ var k = t.getAttribute("data-sec"); S.sets[k] = !S.sets[k]; render(true); return; }
    if(t.hasAttribute("data-sw")){ var w = t.getAttribute("data-sw"); if(w === "adhd") S.adhdOn = !S.adhdOn; else S.mgmt = !S.mgmt; render(true); return; }
    if(t.hasAttribute("data-hold")){ var hn = +t.getAttribute("data-hold"); S.openHold = S.openHold === hn ? 0 : hn; render(true); return; }
    if(t.hasAttribute("data-adhd-done")){ S.adhd.splice(+t.getAttribute("data-adhd-done"), 1); render(true); if(!S.adhd.length) setTimeout(function(){ S.adhd = null; render(true); }, 1600); return; }
    if(t.hasAttribute("data-tx")){ var i = +t.getAttribute("data-tx"); S.openTx = S.openTx === i ? null : i; render(true); return; }
    if(t.hasAttribute("data-shop")){ var s = S.shopping[+t.getAttribute("data-shop")]; s.c = !s.c; render(true); return; }
    var act = t.getAttribute("data-act"), id = t.getAttribute("data-id");
    if(act === "ask"){ S.modal = true; S.mode = "ASK"; render(true); }
    else if(act === "closeM"){ if(e.target.closest("[data-keep]") && t.tagName !== "BUTTON") return; S.modal = false; render(true); }
    else if(act === "done"){ var d = S.duties.filter(function(x){ return x.id === id; })[0]; d.done = !d.done; render(true); }
    else if(act === "pet"){ S.petMsg = T.yMsgs[Math.floor(Math.random() * T.yMsgs.length)]; S.bounce = true; render(true); S.bounce = false; clearTimeout(window.__pt); window.__pt = setTimeout(function(){ S.petMsg = T.yMsg0; render(true); }, 2500); }
    else if(act === "more"){ S.yMore = !S.yMore; render(true); }
    else if(act === "adhd"){ S.adhd = [{k: "l", t: T.vacuum, late: 1}, {k: "p", t: T.persoTask, late: 0}]; render(true); }
    else if(act === "adhdClose"){ S.adhd = null; render(true); }
    else if(act === "menu"){ S.menu = S.menu === id ? null : id; render(true); }
    else if(act === "swap"){ S.menu = null; render(true); }
    else if(act === "save"){ if(S.balance >= 500){ S.balance -= 500; S.savings += 500; } render(true); }
    else if(act === "role"){ S.role = S.role === "child" ? "parent" : "child"; S.view = "home"; window.scrollTo(0, 0); render(); }
    else if(act === "ok" || act === "no"){ var r = S.parentQueue.filter(function(x){ return String(x.id) === id; })[0]; r.status = act === "ok" ? "APPROVED" : "REJECTED";
      if(r.kind === "money" && act === "ok" && r.mine){ S.balance += r.amount; S.txs.unshift({t: "DEPOSIT", a: r.amount, sign: 1, d: "21.10.2026", h: "17:30", after: S.balance}); }
      var mine = S.requests.filter(function(x){ return x.id === r.id; })[0]; if(mine) mine.status = r.status; render(true); }
  });
  root.addEventListener("submit", function(e){
    e.preventDefault();
    var amt = Math.round(parseFloat(document.getElementById("mAmt").value || "0") * 100); if(!(amt > 0)) amt = 500;
    var why = document.getElementById("mWhy").value.trim();
    var r = {id: S.nextId++, kind: "money", who: T.me, amount: amt, comment: why, status: "PENDING", mine: true};
    S.requests.unshift(r); S.parentQueue.unshift({id: r.id, kind: "money", who: T.me, amount: amt, comment: why, status: "PENDING", mine: true});
    S.modal = false; S.view = "home"; window.scrollTo(0, 0); render();
  });

  /* what the story calls: show(view) puts the app in a given state, like a person getting there */
  window.MH = {
    show: function(v){
      S.modal = false; S.menu = null; S.openTx = null; S.adhd = null; window.scrollTo(0, 0);
      var o = {
        home: function(){ S.role = "child"; S.view = "home"; },
        request: function(){ S.role = "child"; S.view = "home"; S.modal = true; S.mode = "ASK"; },
        money: function(){ S.role = "child"; S.view = "money"; S.moneyTab = "money"; },
        savings: function(){ S.role = "child"; S.view = "money"; S.moneyTab = "savings"; },
        tasks: function(){ S.role = "child"; S.view = "house"; S.houseTab = "tasks"; },
        parent: function(){ S.role = "parent"; S.view = "home"; },
        stocks: function(){ S.role = "child"; S.view = "money"; S.moneyTab = "stocks"; S.openHold = 1; },
        meals: function(){ S.role = "child"; S.view = "house"; S.houseTab = "meals"; S.slot = "DINNER"; },
        clean: function(){ S.role = "child"; S.view = "house"; S.houseTab = "clean"; },
        shop: function(){ S.role = "child"; S.view = "house"; S.houseTab = "shop"; },
        settings: function(){ S.role = "child"; S.view = "settings"; S.sets.account = true; S.sets.general = false; },
        young: function(){ S.role = "child"; S.view = "young"; S.yMore = false; },
        adhd: function(){ S.role = "child"; S.view = "home"; S.adhd = [{k: "l", t: T.vacuum, late: 1}, {k: "p", t: T.persoTask, late: 0}]; }
      }[v] || function(){}; o(); render();
      if(v === "request") setTimeout(function(){ var a = document.getElementById("mAmt"); if(a && !a.value){ a.value = "5"; var w = document.getElementById("mWhy"); if(w) w.value = LANG === "fr" ? "Une glace avec Camille" : "An ice cream with Camille"; } }, 350);
    }
  };
  render();
  if(q.get("view")) window.MH.show(q.get("view"));
  window.parent !== window && window.parent.postMessage({mh: "ready"}, "*");
})();
</script>
</body>
</html>
