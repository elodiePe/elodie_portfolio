.ai-sheet{max-width:640px}
.ai-sheet .body{display:grid;gap:14px}
.ai-lead{margin:0;font-size:15.5px}
.ai-list{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--muted)}
.ai-list b{color:var(--ink)}
.ai-tabs{display:flex}
.ai-tabs button{flex:1;justify-content:center}
.ai-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--bg)}
.ai-opts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.ai-lab{font-weight:700;color:var(--ink);font-size:13.5px}
.ai-go{padding:11px 20px;font-size:15px}
@media (max-width:560px){.ai-go{width:100%;justify-content:center}.ai-row{padding:10px}}
.ai-opts select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.ai-out{min-height:60px}
.ai-md{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.ai-md>:first-child{margin-top:0}
.ai-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ai-card{position:relative;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px;min-height:120px;cursor:pointer;color:var(--ink);font:inherit;display:grid;align-content:start;gap:8px}
.ai-card .b{display:none;color:var(--ink);border-top:1px dashed var(--line);padding-top:8px}
.ai-card.flip{background:var(--accent-soft)}
.ai-card.flip .b{display:block}
.ai-card .f{font-weight:700}
.ai-card small{position:absolute;right:10px;top:8px;color:var(--muted);font:600 11px var(--f-mono)}
.ai-q h4{margin:6px 0 10px;font-size:17px}
.ai-prog{font:600 12px var(--f-mono);color:var(--muted)}
.ai-ch{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;margin:8px 0;color:var(--ink);font:inherit;cursor:pointer}
.ai-ch b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:12px}
.ai-ch.good{border-color:var(--good,#16a34a);background:color-mix(in srgb,var(--good,#16a34a) 12%,var(--surface))}
.ai-ch.bad{border-color:var(--bad,#dc2626);background:color-mix(in srgb,var(--bad,#dc2626) 10%,var(--surface))}
.ai-ch[disabled]{cursor:default}
.ai-explain{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;margin:6px 0 10px}
.ai-acts{display:flex;gap:8px;flex-wrap:wrap}
.ai-acts.ai-right{justify-content:flex-end}
.ai-foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0}
.ai-link{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.ai-err{background:color-mix(in srgb,var(--bad,#dc2626) 10%,var(--surface));border:1px solid var(--bad,#dc2626);border-radius:12px;padding:10px 12px;font-size:14px}
.ai-score{font:800 34px/1.1 var(--f-display,inherit)}
.ai-out{margin-top:6px}
.ai-ready{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--accent)}
.ai-ready .btn{margin-left:auto}
.ai-md,.ai-cards,.ai-qlist{margin-top:14px}
.ai-ready b{display:block;font-size:15px}
.ai-sheet{min-width:0;max-width:min(640px,100%)}
.st-nav{position:fixed;top:50%;transform:translateY(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:2px;width:64px;padding:10px 4px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.st-nav span{font:700 34px/1 var(--f-body)}.st-nav small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 10px var(--f-body);letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.st-nav:hover{border-color:var(--accent)}
.st-nav-prev{left:max(8px,calc(50% - 320px - 76px))}.st-nav-next{right:max(8px,calc(50% - 320px - 76px))}
@media (max-width:760px){.st-nav{width:44px;padding:8px 2px;opacity:.92}.st-nav small{display:none}.st-nav span{font-size:28px}.st-nav-prev{left:4px}.st-nav-next{right:4px}}
.ai-sheet .body{min-width:0;max-width:100%}
.ai-sheet .body{overflow-x:hidden}
.ai-sheet .body>*{min-width:0;max-width:100%}
.ai-sheet .ai-tabs{display:flex;flex-wrap:nowrap}
.ai-sheet .ai-tabs button{flex:1 1 0;min-width:0;padding-left:6px;padding-right:6px}
.ac-files{min-width:0;margin:12px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ac-files>summary{cursor:pointer;padding:10px 12px;font:600 13.5px var(--f-body);display:flex;justify-content:space-between;gap:10px}
.ac-files>summary b{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ac-files-acts{display:flex;gap:14px;padding:0 12px 6px}
.ac-files-list{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:0 8px 8px;max-height:260px;overflow:auto}
.ac-file{min-width:0;display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:none;color:var(--ink);border-radius:10px;padding:8px;cursor:pointer;font:inherit;font-size:13.5px}
.ac-file i{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;flex:none}
.ac-file[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,#fff)}
.ac-file span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-file small{color:var(--muted);font-size:11.5px;flex:none}
.ai-ready span{display:block;font-size:12.5px;line-height:1.4;color:var(--muted)}
.ai-ready>div:first-child{flex:1 1 220px;min-width:0}
.ai-qlist{margin:10px 0 0;padding-left:22px;display:grid;gap:8px;font-size:14.5px}
.ai-qlist small{color:var(--muted);font:600 11px var(--f-mono)}
.ai-ask{display:grid;gap:8px;width:100%}
.ai-ask textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;resize:vertical;min-height:64px}
.ai-askrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ai-saved{display:flex;gap:6px;align-items:center;margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.ai-saved svg{width:15px;height:15px;flex:none}
.ai-saved.bad{color:var(--bad,#dc2626)}
.stu-row{display:grid;gap:6px;margin:12px 0}
.stu-seg{display:flex;flex-wrap:wrap;gap:6px}
.stu-seg button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:600 13px var(--f-body);cursor:pointer}
.stu-seg button small{opacity:.65;font-family:var(--f-mono);margin-left:3px}
.stu-seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stu-sw{display:flex;gap:10px;align-items:flex-start;margin:12px 0;cursor:pointer}
.stu-sw input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.stu-sw b{display:block;font-size:14px}.stu-sw small{display:block;color:var(--muted);font-size:12.5px}
.stu-type{width:100%;margin-top:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;resize:vertical}
.stc-typed{margin-top:8px;font-size:13px;opacity:.8}
.stu-clock{margin:6px 0 2px}.stu-clock i{transition:width 1s linear}
.ai-ch.picked{border-color:var(--ink);background:var(--bg)}
.stu-rev{display:grid;gap:10px;margin-top:14px;text-align:left}
.stu-miss{display:grid;gap:3px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.stu-miss .bad{color:var(--bad,#dc2626)}.stu-miss .good{color:var(--good,#16a34a)}.stu-miss small{color:var(--muted)}
.ai-track{height:6px;border-radius:99px;background:var(--bg);overflow:hidden}
.ai-btns{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.ai-ready .ai-btns{margin:0 0 0 auto;justify-content:flex-end;flex:0 0 auto}
.ai-track i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.stc-card{display:grid;align-content:center;justify-items:center;gap:10px;min-height:200px;width:100%;border:1.5px solid var(--line);border-radius:18px;background:var(--bg);color:var(--ink);padding:22px;cursor:pointer;font:inherit;text-align:center}
.stc-card.flip{background:var(--accent-soft);border-color:var(--accent)}
